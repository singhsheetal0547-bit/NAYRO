name: NAYRO Android Verification

on:
  push:
    branches: [main, fix/agent-runtime-integration-p0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: nayro-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''
      - name: Install required Android SDK
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"
      - name: Verify Android SDK packages
        run: |
          test -d "$ANDROID_HOME/platforms/android-36.1"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
      - name: Validate Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version
      - name: Generate and verify CI debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey
      - name: Assemble NAYRO debug APK
        run: ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleDebug
      - name: Verify APK and merged manifest permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK produced: $APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" || true
      - name: Remove previous NAYRO debug APK artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const old = artifacts.filter(a => a.name === "NAYRO-debug-apk" && !a.expired);
            for (const artifact of old) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner, repo: context.repo.repo, artifact_id: artifact.id
              });
            }
            core.info(`Deleted ${old.length} old APK artifact(s).`);
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NAYRO-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''
      - name: Accept Android SDK licenses and install compile SDK
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"
      - name: Run JVM unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

  instrumentation:
    name: Android instrumentation smoke tests (emulator)
    runs-on: ubuntu-latest
    needs: [build, unit-tests]
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''
      - name: Accept Android SDK licenses, install compile SDK and generate debug signing key
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/debug.keystore" -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Run Android instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
