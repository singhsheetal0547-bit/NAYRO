name: NAYRO Android Debug APK

on:
  push:
    branches: [main, fix/nayro-ready-agent]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: nayro-final-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build the one final NAYRO APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Python for official Sherpa tokenizer
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Sherpa-ONNX model tooling
        run: python -m pip install --disable-pip-version-check "sherpa-onnx==2.0.3"

      - name: Download and prepare official GigaSpeech Zipformer2 KWS assets
        run: bash .github/scripts/prepare-sherpa-kws-assets.sh

      - name: Download official Sherpa-ONNX Android AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar" \
            --output app/libs/sherpa-onnx-2.0.3.aar
          echo "4c766e2e74c9d33d595338c21fe3b305c73ba45d47e96a235675c33142a2ec50  app/libs/sherpa-onnx-2.0.3.aar" | sha256sum -c -
          ls -lh app/libs/sherpa-onnx-2.0.3.aar

      - name: Verify official AAR API classes and JNI dependencies
        shell: bash
        run: |
          set -euo pipefail
          AAR="app/libs/sherpa-onnx-2.0.3.aar"
          ENTRIES="$(unzip -Z1 "$AAR")"
          echo "$ENTRIES" | grep -Fxq 'classes.jar'
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            echo "$ENTRIES" | grep -Fxq "jni/$ABI/libsherpa-onnx-jni.so"
            echo "$ENTRIES" | grep -Fxq "jni/$ABI/libonnxruntime.so"
          done
          echo "Verified official Kotlin API and sherpa/ONNX native libraries for ARM64, ARMv7 and x86_64."

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install exact Android SDK required by this repository
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36.1"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Validate Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Generate CI debug signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey

      - name: Resolve app runtime dependencies without assembling an APK
        run: ./gradlew --no-daemon --stacktrace :app:dependencies --configuration debugRuntimeClasspath

      - name: Validate all Sherpa ONNX model assets before compilation
        shell: bash
        run: |
          set -euo pipefail
          DIR="app/src/main/assets/kws-model"
          for MODEL in \
            encoder-epoch-12-avg-2-chunk-16-left-64.onnx \
            decoder-epoch-12-avg-2-chunk-16-left-64.onnx \
            joiner-epoch-12-avg-2-chunk-16-left-64.onnx \
            tokens.txt keywords.txt; do
            test -s "$DIR/$MODEL"
          done
          echo "All 3 ONNX model files plus tokens and BPE keyword tokens are present."
          du -h "$DIR"/*
          sha256sum "$DIR"/*.onnx "$DIR/tokens.txt" "$DIR/keywords.txt"

      - name: Run JVM tests before the only APK assembly
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Assemble the final NAYRO APK once
        run: ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Inspect the final APK payload and required permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "Final APK: $APK"
          ls -lh "$APK"

          ENTRIES="$(unzip -Z1 "$APK")"
          for MODEL in \
            encoder-epoch-12-avg-2-chunk-16-left-64.onnx \
            decoder-epoch-12-avg-2-chunk-16-left-64.onnx \
            joiner-epoch-12-avg-2-chunk-16-left-64.onnx \
            tokens.txt keywords.txt; do
            echo "$ENTRIES" | grep -Fxq "assets/kws-model/$MODEL"
          done

          for ABI in arm64-v8a armeabi-v7a x86_64; do
            echo "$ENTRIES" | grep -Fxq "lib/$ABI/libsherpa-onnx-jni.so"
            echo "$ENTRIES" | grep -Fxq "lib/$ABI/libonnxruntime.so"
          done
          echo "APK contains all ONNX models, keyword assets, and native Sherpa/ONNX libraries."

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          grep -q 'android.permission.RECORD_AUDIO' apk-permissions.txt
          grep -q 'android.permission.FOREGROUND_SERVICE_MICROPHONE' apk-permissions.txt
          echo "$APK" > apk-path.txt

      - name: Remove previous NAYRO APK artifacts to free Actions storage
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );
            const previousApks = artifacts.filter(
              artifact => artifact.name === "NAYRO-debug-apk" && !artifact.expired
            );
            for (const artifact of previousApks) {
              core.info(`Deleting old NAYRO APK artifact ID ${artifact.id} (${artifact.size_in_bytes} bytes)`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }
            core.info(`Deleted ${previousApks.length} previous APK artifact(s).`);

      - name: Upload the one final NAYRO APK
        uses: actions/upload-artifact@v4
        with:
          name: NAYRO-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
