name: NAYRO Android Debug APK

on:
  push:
    branches: [main, fix/agent-runtime-integration-p0]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: nayro-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK tools without interactive license prompt
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Install exact Android SDK required by this repository
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Verify Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-36.1"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "Installed compile platform and build tools:"
          ls -la "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Validate Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Generate and verify CI debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey
      - name: Build NAYRO debug APK
        run: ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Verify APK and print merged manifest permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK produced: $APK"
          ls -lh "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump permissions "$APK" || true
          echo "$APK" > apk-path.txt

      - name: Remove previous NAYRO debug APK artifacts to free Actions storage
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            const previousApks = artifacts.filter(
              artifact =>
                artifact.name === "NAYRO-debug-apk" &&
                !artifact.expired
            );

            for (const artifact of previousApks) {
              core.info(`Deleting old artifact ${artifact.name} (ID: ${artifact.id}, size: ${artifact.size_in_bytes} bytes)`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }

            core.info(`Deleted ${previousApks.length} previous NAYRO debug APK artifact(s).`);

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NAYRO-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
