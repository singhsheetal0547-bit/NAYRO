name: NAYRO Android Debug APK

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: nayro-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate Sherpa-ONNX, Build APK & Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify Sherpa-ONNX AAR and KWS model assets integrity before APK build
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "app/src/main/java/com/k2fsa/sherpa/onnx/SherpaOnnxKwsCompat.kt" ]; then
            echo "ERROR: Fake SherpaOnnxKwsCompat.kt stub must not exist!"
            exit 1
          fi
          AAR="$(find app/libs -maxdepth 1 -type f -name 'sherpa-onnx*.aar' -print -quit)"
          test -n "$AAR"
          test -s "$AAR"
          echo "Verifying archive integrity of Sherpa-ONNX AAR: $AAR"
          unzip -t "$AAR" >/dev/null
          sha256sum "$AAR"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -l "$AAR" | grep -q "jni/${abi}/libsherpa-onnx-jni.so"
            unzip -l "$AAR" | grep -q "jni/${abi}/libonnxruntime.so"
          done
          unzip -l "$AAR" | grep -q "classes.jar"
          KWS_DIR="app/src/main/assets/kws-model"
          if [ ! -d "$KWS_DIR" ] && [ -d "src/main/assets/kws-model" ]; then
            KWS_DIR="src/main/assets/kws-model"
          fi
          test -d "$KWS_DIR"
          for model_file in \
            "encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx" \
            "decoder-epoch-12-avg-2-chunk-16-left-64.onnx" \
            "joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx" \
            "tokens.txt" \
            "keywords.txt"; do
            f="${KWS_DIR}/${model_file}"
            test -f "$f"
            test -s "$f"
            sha256sum "$f"
            echo "Verified KWS model asset integrity: $f"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK tools without interactive license prompt
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Install exact Android SDK required by this repository
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Verify Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-36.1"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "Installed compile platform and build tools:"
          ls -la "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Validate Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Generate and verify CI debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey

      - name: Verify Sherpa-ONNX native .so libraries and KWS model assets via Gradle
        run: ./gradlew --no-daemon --stacktrace verifySherpaRuntimeAssets

      - name: Run unit tests before APK packaging
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build final NAYRO debug APK
        run: ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Inspect APK contents for Sherpa-ONNX native libs and ONNX KWS model assets
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK produced: $APK"
          ls -lh "$APK"
          APK_LIST="$(unzip -l "$APK")"
          echo "$APK_LIST" | grep -q "lib/arm64-v8a/libsherpa-onnx-jni.so"
          echo "$APK_LIST" | grep -q "lib/arm64-v8a/libonnxruntime.so"
          echo "$APK_LIST" | grep -q "assets/kws-model/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
          echo "$APK_LIST" | grep -q "assets/kws-model/decoder-epoch-12-avg-2-chunk-16-left-64.onnx"
          echo "$APK_LIST" | grep -q "assets/kws-model/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
          echo "$APK_LIST" | grep -q "assets/kws-model/tokens.txt"
          echo "$APK_LIST" | grep -q "assets/kws-model/keywords.txt"
          echo "Verified all Sherpa-ONNX native libraries and ONNX KWS assets inside APK!"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump permissions "$APK" || true
          echo "$APK" > apk-path.txt

      - name: Remove previous NAYRO debug APK artifacts to free Actions storage
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            const previousApks = artifacts.filter(
              artifact =>
                artifact.name === "NAYRO-debug-apk" &&
                !artifact.expired
            );

            for (const artifact of previousApks) {
              core.info(`Deleting old artifact ${artifact.name} (ID: ${artifact.id}, size: ${artifact.size_in_bytes} bytes)`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }

            core.info(`Deleted ${previousApks.length} previous NAYRO debug APK artifact(s).`);

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NAYRO-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
