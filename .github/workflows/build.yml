name: NAYRO Android Debug APK

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: nayro-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify Sherpa-ONNX, Test & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache pinned official Sherpa-ONNX AAR
        uses: actions/cache@v4
        with:
          path: app/libs/sherpa-onnx-2.0.3.aar
          key: sherpa-onnx-android-v2.0.3-4c766e2e74c9d33d595338c21fe3b305c73ba45d47e96a235675c33142a2ec50

      - name: Download and verify official Sherpa-ONNX Android runtime
        shell: bash
        run: bash scripts/prepare-sherpa-onnx-android.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Install exact Android SDK required by this repository
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Verify Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-36.1"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Validate Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Verify official Sherpa-ONNX runtime and KWS model assets
        run: ./gradlew --no-daemon --stacktrace verifySherpaRuntimeAssets

      - name: Run unit tests and compile application sources
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Generate and verify CI debug keystore
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey

      - name: Build final NAYRO debug APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Inspect APK native libraries and KWS model assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK produced: $APK"
          ls -lh "$APK"
          APK_LIST="$(unzip -l "$APK")"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            echo "$APK_LIST" | grep -q "lib/$abi/libsherpa-onnx-jni.so"
            echo "$APK_LIST" | grep -q "lib/$abi/libonnxruntime.so"
          done
          echo "$APK_LIST" | grep -q "assets/kws-model/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
          echo "$APK_LIST" | grep -q "assets/kws-model/decoder-epoch-12-avg-2-chunk-16-left-64.onnx"
          echo "$APK_LIST" | grep -q "assets/kws-model/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
          echo "$APK_LIST" | grep -q "assets/kws-model/tokens.txt"
          echo "$APK_LIST" | grep -q "assets/kws-model/keywords.txt"
          echo "Verified official Sherpa JNI + ONNX Runtime and all KWS model assets in the APK."

      - name: Remove previous NAYRO debug APK artifacts to free Actions storage
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const previousApks = artifacts.filter(
              artifact => artifact.name === "NAYRO-debug-apk" && !artifact.expired
            );
            for (const artifact of previousApks) {
              core.info(`Deleting old artifact ${artifact.name} (ID: ${artifact.id}, size: ${artifact.size_in_bytes} bytes)`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }
            core.info(`Deleted ${previousApks.length} previous NAYRO debug APK artifact(s).`);

      - name: Upload debug APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: NAYRO-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
